<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor para Terabecquerel (TBq)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Converter para Terabecquerel (TBq)</h1>

        <label for="valor">Valor:</label>
        <input type="number" id="valor" placeholder="Digite o valor">

        <label for="unidade">Unidade:</label>
        <select id="unidade">
            <option value="Bq">Becquerel (Bq)</option>
            <option value="KBq">Kilobecquerel (KBq)</option>
            <option value="MBq">Megabecquerel (MBq)</option>
            <option value="GBq">Gigabecquerel (GBq)</option>
            <option value="PBq">Petabecquerel (PBq)</option>
            <!-- Adicione mais unidades se precisar -->
        </select>

        <button onclick="converterParaTBq()">Converter</button>

        <div id="resultado">
            <h2>Resultado:</h2>
            <p id="tbq">Terabecquerel (TBq): </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
